query GetProject($id: String!) {
  project(id: $id) {
    ...ProjectFields
    content
    allTeams: teams(first: 100) {
      nodes {
        id
        key
      }
    }
    allLabels: labels(first: 100) {
      nodes {
        id
        name
      }
    }
    members(first: 100) {
      nodes {
        id
        name
      }
    }
    initiatives(first: 50) {
      nodes {
        id
        name
      }
    }
  }
}
